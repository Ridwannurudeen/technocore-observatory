server {
    listen 80;
    listen [::]:80;
    server_name technocore.gudman.xyz;

    include /etc/nginx/snippets/acme-challenge.conf;
    access_log /var/log/nginx/technocore.gudman.xyz.access.log observatory_privacy;
    root /opt/technocore-observatory/current;

    error_page 400 =400 /errors/api-bad-request$observatory_error_suffix;
    error_page 405 =405 /errors/api-method-not-allowed$observatory_error_suffix;
    error_page 429 =429 /errors/api-rate-limited$observatory_error_suffix;
    error_page 503 =503 /errors/query-unavailable$observatory_error_suffix;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Cache-Control $observatory_cache_control always;
    add_header Allow $observatory_allow always;

    location ^~ /errors/ {
        internal;
        try_files $uri =404;
    }

    location / {
        return 301 https://technocore.gudman.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name technocore.gudman.xyz;

    root /opt/technocore-observatory/current;
    index index.html;
    charset utf-8;
    charset_types text/plain;
    gzip_vary on;

    ssl_certificate /etc/letsencrypt/live/technocore.gudman.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technocore.gudman.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/technocore.gudman.xyz.access.log observatory_privacy;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control $observatory_cache_control always;
    add_header X-Robots-Tag $observatory_robots always;
    add_header Retry-After $observatory_retry_after always;
    add_header Allow $observatory_allow always;

    limit_req_status 429;

    error_page 400 =400 /errors/api-bad-request$observatory_error_suffix;
    error_page 405 =405 /errors/api-method-not-allowed$observatory_error_suffix;
    error_page 429 =429 /errors/api-rate-limited$observatory_error_suffix;
    error_page 503 =503 /errors/query-unavailable$observatory_error_suffix;

    location ^~ /errors/ {
        internal;
        try_files $uri =404;
    }

    location = /api/v1/status {
        if ($observatory_static_request_valid = 0) {
            return 400;
        }
        try_files /api/v1/status$observatory_format_suffix =503;
    }

    location = /api/v1/methodology {
        if ($observatory_static_request_valid = 0) {
            return 400;
        }
        try_files /api/v1/methodology$observatory_format_suffix =503;
    }

    location = /api/v1/incidents {
        if ($observatory_static_request_valid = 1) {
            rewrite ^ /api/v1/incidents$observatory_format_suffix? last;
        }
        limit_req zone=observatory_query burst=10 nodelay;
        proxy_intercept_errors on;
        error_page 400 =400 /errors/api-bad-request$observatory_error_suffix;
        error_page 405 =405 /errors/api-method-not-allowed$observatory_error_suffix;
        error_page 429 =429 /errors/api-rate-limited$observatory_error_suffix;
        error_page 502 503 504 =503 /errors/query-unavailable$observatory_error_suffix;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
    }

    location = /api/v1/changes {
        if ($observatory_static_request_valid = 1) {
            rewrite ^ /api/v1/changes$observatory_format_suffix? last;
        }
        limit_req zone=observatory_query burst=10 nodelay;
        proxy_intercept_errors on;
        error_page 400 =400 /errors/api-bad-request$observatory_error_suffix;
        error_page 405 =405 /errors/api-method-not-allowed$observatory_error_suffix;
        error_page 429 =429 /errors/api-rate-limited$observatory_error_suffix;
        error_page 502 503 504 =503 /errors/query-unavailable$observatory_error_suffix;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
    }

    location ~ ^/api/v1/(?:rooms(?:/|$)|dids(?:/|$)) {
        limit_req zone=observatory_query burst=10 nodelay;
        proxy_intercept_errors on;
        error_page 400 =400 /errors/api-bad-request$observatory_error_suffix;
        error_page 405 =405 /errors/api-method-not-allowed$observatory_error_suffix;
        error_page 429 =429 /errors/api-rate-limited$observatory_error_suffix;
        error_page 502 503 504 =503 /errors/query-unavailable$observatory_error_suffix;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
    }

    location = /rooms/ {
        if ($observatory_rooms_static_request_valid = 1) {
            rewrite ^ /rooms/index.html? last;
        }
        limit_req zone=observatory_query burst=10 nodelay;
        proxy_intercept_errors on;
        error_page 429 =429 @html_rate_limited;
        error_page 502 503 504 =503 @html_unavailable;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
    }

    location ~ "^/(?:rooms/[0-9a-f]{16}|keys/[^/]+)/$" {
        limit_req zone=observatory_query burst=10 nodelay;
        proxy_intercept_errors on;
        error_page 429 =429 @html_rate_limited;
        error_page 502 503 504 =503 @html_unavailable;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
    }

    location ~ ^/api/v1/(?:incidents|changes)\.(?:txt|json)$ {
        internal;
        try_files $uri =503;
    }

    location @html_unavailable {
        try_files /errors/query-unavailable.html =503;
    }

    location @html_rate_limited {
        try_files /errors/query-rate-limited.html =429;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
