# Include this file once inside nginx's http {} block.

log_format observatory_privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

limit_req_zone $binary_remote_addr zone=observatory_query:10m rate=30r/m;

map $arg_format $observatory_format_suffix {
    "" ".txt";
    ~^json$ ".json";
    default "";
}

map $arg_format $observatory_error_suffix {
    ~^json$ ".json";
    default ".txt";
}

map $args $observatory_static_request_valid {
    "" 1;
    ~^format=json$ 1;
    default 0;
}

map $args $observatory_rooms_static_request_valid {
    "" 1;
    default 0;
}

map $status $observatory_retry_after {
    429 "60";
    default "";
}

map $status $observatory_allow {
    405 "GET, HEAD";
    default "";
}

map $request_uri $observatory_robots {
    default "";
    ~^/(?:rooms|keys)(?:/|\?|$) "noindex, nofollow, noarchive";
    ~^/api/v1/rooms(?:/|\?|$) "noindex, nofollow, noarchive";
    ~^/api/v1/dids(?:/|\?|$) "noindex, nofollow, noarchive";
}

map "$status:$observatory_static_request_valid:$request_uri" $observatory_cache_control {
    default "";
    ~^(?:400|405|429|503): "no-store";
    ~^(?:200|206|304):1:/api/v1/(?:status|incidents|changes|methodology)(?:\?|$) "public, max-age=60, stale-if-error=300";
    ~^(?:200|206|304):1:/api/v1/(?:status|methodology)\.(?:txt|json)(?:\?|$) "public, max-age=60, stale-if-error=300";
    ~^[0-9][0-9][0-9]:0:/api/v1/(?:incidents|changes)(?:\?|$) "no-store";
    ~^[0-9][0-9][0-9]:[01]:/(?:rooms|keys)(?:/|\?|$) "no-store";
    ~^[0-9][0-9][0-9]:[01]:/api/v1/(?:rooms|dids)(?:/|\?|$) "no-store";
}
