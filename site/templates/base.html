  <script>
    // Read before first paint so a stored dark preference never flashes light.
    try {
      const stored = localStorage.getItem("observatory-theme");
      if (stored === "light" || stored === "dark")
        document.documentElement.dataset.theme = stored;
    } catch {
      document.documentElement.dataset.themeStorage = "unavailable";
    }
  </script>

  <script src="%%ASSET_PREFIX%%assets/site.js" defer></script>
